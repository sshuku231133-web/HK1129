<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>ダメージ計算ツール | 変数式計算</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-hidden="true">DM</div>
        <div class="brand-copy">
          <p class="eyebrow">DAMAGE CALCULATOR</p>
          <h1>ダメージ計算ツール</h1>
        </div>
      </header>

      <section class="panel calculator-panel">
        <div class="panel-header">
          <div>
            <p class="section-kicker">SETUP</p>
            <h2>計算条件</h2>
          </div>
          <label class="count-control">
            <span>変数数</span>
            <select id="variableCount" aria-label="変数の数を選択">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
            </select>
          </label>
        </div>

        <div class="variable-list" id="variableList" aria-label="変数一覧"></div>

        <div class="setup-actions">
          <button type="button" class="secondary-button" id="resetAllButton">全てリセット</button>
          <button type="button" class="primary-button" id="solveMissingButton">空欄を逆算</button>
        </div>
        <p class="helper-text">1つだけ空欄にして、他の変数と目標値を入力すると逆算できます。</p>
      </section>

      <section class="panel formula-panel">
        <div class="panel-header compact">
          <div>
            <p class="section-kicker">FORMULA</p>
            <h2>計算式</h2>
          </div>
        </div>

        <div class="formula-toolbar" aria-label="演算子と括弧の挿入">
          <button type="button" data-insert=" + ">＋</button>
          <button type="button" data-insert=" - ">−</button>
          <button type="button" data-insert=" * ">×</button>
          <button type="button" data-insert=" / ">÷</button>
          <button type="button" data-insert=" ( ">(</button>
          <button type="button" data-insert=" ) ">)</button>
          <button type="button" class="toolbar-clear" id="clearFormulaButton">クリア</button>
        </div>

        <label class="sr-only" for="formulaInput">計算式</label>
        <textarea id="formulaInput" rows="3" spellcheck="false" placeholder="例: 攻撃力 * (威力 + 追加ダメージ)"></textarea>

        <div class="chip-list" id="variableChips" aria-label="変数チップ"></div>
        <p class="helper-text">変数名は自由に設定できます。演算子や括弧を使って、ゲームの式をそのまま組み立てられます。</p>
      </section>

      <section class="result-strip" aria-live="polite">
        <div>
          <p class="section-kicker">RESULT</p>
          <p class="answer" id="answer">—</p>
        </div>
        <div class="result-actions">
          <label class="target-field" for="targetValue">
            <span>目標値</span>
            <input id="targetValue" type="number" inputmode="decimal" step="any" placeholder="逆算用の目標値">
          </label>
          <p id="statusMessage">数値と式を入力して計算します。</p>
          <div class="action-row">
            <button class="primary-button" id="calculateButton" type="button">計算する</button>
          </div>
        </div>
      </section>
    </main>

    <script src="sketch.js"></script>
  </body>
</html>
